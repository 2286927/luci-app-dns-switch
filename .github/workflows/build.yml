name: build

# 只在三种情况跑，不做「每次 push 都构建」：
# 私有仓库的 Actions 分钟数是要花钱的，而 SDK 构建一次双架构要 40 分钟以上。
# 推 11 个文件就是 9 次 run × 2 个 SDK，足够把一个月的额度烧掉。
on:
  workflow_dispatch:          # 手动触发（默认用法）
  push:
    tags: [ 'v*' ]            # 打版本标签时自动出包
  pull_request:
    paths:                    # 动到包本体才验证
      - 'luci-app-dns-switch/**'
      - 'check.sh'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-23.05.5
          - x86_64-24.10.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GitHub 网页上传统一按 644 存，脚本进仓库就丢了执行位。
      # luci.mk 打包用的是 cp -p，644 会原样进包——装到设备上 dns-switch
      # 跑不起来、init 脚本不执行，属于「打包成功但装上就废」。
      # 在构建前补回来，比依赖 git 的 mode 位可靠：zip 下载、fork、
      # 别人本地 clone 出来的都是 644，只有这一步能兜住。
      - name: Restore executable bits
        run: |
          chmod +x luci-app-dns-switch/root/usr/bin/dns-switch
          chmod +x luci-app-dns-switch/root/etc/init.d/dns-switch
          chmod +x luci-app-dns-switch/root/etc/uci-defaults/99-dns-switch
          ls -l luci-app-dns-switch/root/usr/bin/dns-switch luci-app-dns-switch/root/etc/init.d/dns-switch

      - name: Package structure check
        run: bash check.sh

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          # 不能带连字符。gh-action-sdk 会写 `src-link $FEEDNAME /feed/`，
          # 而 OpenWrt 的 scripts/feeds 用 `\s+(\w+)` 取 feed 名——`\w` 不含 `-`，
          # 写成 dns-switch 会让整行解析失败，报的却是 "Syntax error in feeds.conf"。
          # 包名 luci-app-dns-switch 不受影响，那是 PACKAGES 而不是 feed 名。
          FEEDNAME: dnsswitch
          PACKAGES: luci-app-dns-switch

      - name: Show artifacts
        run: find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) | sort

      # 配额满时（本仓 2026-11-11 已触发过）这一步必然失败，但编译本身是好的。
      # 让它红掉整个 job 等于用假警报掩盖真问题——历史那两次红都不是编译失败。
      # 静默容忍，产物可从日志或走 build-apk-25.12 线取。
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: luci-app-dns-switch-${{ matrix.sdk }}
          path: bin/packages/
          if-no-files-found: warn
