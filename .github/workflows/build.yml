name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-23.05.5
          - x86_64-24.10.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package structure check
        run: bash check.sh

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: dns-switch
          PACKAGES: luci-app-dns-switch

      - name: Show artifacts
        run: find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) | sort

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-dns-switch-${{ matrix.sdk }}
          path: bin/packages/
          if-no-files-found: error
